# A single-node Elasticsearch for local development and the integration tests.
#   docker compose up -d        start it
#   curl localhost:9200          check it is up
#   docker compose down -v      stop it and delete its data
services:
  elasticsearch:
    image: elasticsearch:9.5.5
    environment:
      - discovery.type=single-node      # one node, no cluster
      - xpack.security.enabled=false    # no passwords or TLS: local development only!
      - ES_JAVA_OPTS=-Xms1g -Xmx1g      # cap memory so it runs on a laptop
    ports:
      - "127.0.0.1:9200:9200"           # reachable from this machine only
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      retries: 30
volumes:
  esdata:
