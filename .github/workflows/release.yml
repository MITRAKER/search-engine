# Release: pushing a tag like v0.1.0 builds the package, checks it, and
# publishes a GitHub Release with the notes from CHANGELOG.md and a signed
# build provenance attestation.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # The exact tool versions from requirements-dev.txt, also for the isolated
  # environment in which `python -m build` installs hatchling.
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-dev.txt

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    services:
      elasticsearch:
        # The same image as docker-compose.yml and CI (tests/test_repo_config.py checks).
        image: elasticsearch:9.5.5@sha256:b7b0f24e9b5e90656ffe69804b3a48907499ab2b9cd67f02b7af3aff1b026a89
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
          cluster.routing.allocation.disk.threshold_enabled: "false"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s
          --health-timeout 40s
          --health-retries 30
    env:
      ES_URL: http://localhost:9200
      REQUIRE_ES: "1" # the integration tests run too, and cannot be skipped
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install
        run: python -m pip install -c requirements-dev.txt -e ".[dev]" build
      - name: Check the tag matches the package version
        run: python scripts/release_notes.py --check-version "$GITHUB_REF_NAME"
      - name: Run the full test suite one more time, on Elasticsearch too
        run: pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
