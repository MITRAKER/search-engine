# Continuous integration: every push and pull request must pass all of these
# checks before it can be merged. It also runs once a day, so a new bug in a
# dependency or a new security advisory is caught even when nobody pushes
# (NASA/JPL rule 10: analyze the code every day).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  # Every pip install uses the exact versions in requirements-dev.txt, even
  # inside the isolated environments where pip and `python -m build` build
  # the package (a -c option on the command line does not reach those).
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-dev.txt

jobs:
  quality:
    name: Lint, format, types, JPL rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: | # a new cache whenever a pin changes
            requirements-dev.txt
            pyproject.toml
      - name: Install
        run: python -m pip install -c requirements-dev.txt -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Format (ruff)
        run: ruff format --check --diff .
      - name: Types (mypy --strict)
        run: mypy
      - name: NASA/JPL Power of Ten rules
        run: python scripts/check_jpl.py searchengine scripts tests
      - name: Repository hygiene (pre-commit hooks)
        env:
          SKIP: ruff-check,ruff-format,mypy,jpl-rules # already run above
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install
        run: python -m pip install -c requirements-dev.txt -e ".[dev]"
      - name: Test with coverage
        # The integration tests need Elasticsearch: they run in their own job below.
        run: pytest -m "not integration" --cov --cov-report=term --cov-report=xml --cov-fail-under=95
      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  integration:
    name: Integration tests (Elasticsearch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      elasticsearch:
        # The same image as docker-compose.yml (tests/test_repo_config.py checks).
        image: elasticsearch:9.5.5@sha256:b7b0f24e9b5e90656ffe69804b3a48907499ab2b9cd67f02b7af3aff1b026a89
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
          cluster.routing.allocation.disk.threshold_enabled: "false"
        ports:
          - 9200:9200
        # Healthy once the cluster is at least yellow. (No "&" in the URL: the
        # check runs in a shell, where "&" would end the command.)
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s
          --health-timeout 40s
          --health-retries 30
    env:
      ES_URL: http://localhost:9200
      REQUIRE_ES: "1" # a missing Elasticsearch fails the tests instead of skipping them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install
        run: python -m pip install -c requirements-dev.txt -e ".[dev]"
      - name: Both engines side by side on Elasticsearch
        run: pytest -m integration
      - name: The command line on Elasticsearch
        run: searchengine --engine es --reindex "inverted index" -k 1 | grep "Inverted index"

  security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No pip cache here: this job installs only pip-audit, and sharing a cache
      # with the jobs that install everything would leave them a partial one.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install -c requirements-dev.txt pip-audit
      - name: pip-audit (known vulnerabilities in every pinned dependency)
        run: pip-audit --strict --progress-spinner off -r requirements-dev.txt --no-deps --disable-pip

  build:
    name: Build and smoke-test the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        # build and hatchling come from requirements-dev.txt (see PIP_CONSTRAINT above).
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/searchengine "inverted index" -k 1 | grep "Inverted index"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
