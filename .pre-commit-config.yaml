# Checks that run on your machine before every commit, so problems are fixed
# before CI ever sees them. Set up once with:  pre-commit install
# Run on everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict type checks)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: jpl-rules
        name: NASA/JPL Power of Ten rules
        entry: python scripts/check_jpl.py searchengine scripts tests
        language: system
        types: [python]
        pass_filenames: false
