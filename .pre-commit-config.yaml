# Checks that run on your machine before every commit, so problems are fixed
# before CI ever sees them. Set up once with:  pre-commit install
# Run on everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
        args: [--assume-in-merge] # check for conflict markers even outside a merge (CI)
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all] # every file, not only newly added ones (CI)
      - id: detect-private-key

  # The tools below run from your environment, at the versions pinned in
  # requirements-dev.txt, so the hooks and CI always run the same versions.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict type checks)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: jpl-rules
        name: NASA/JPL Power of Ten rules
        entry: python scripts/check_jpl.py searchengine scripts tests
        language: system
        types: [python]
        pass_filenames: false
